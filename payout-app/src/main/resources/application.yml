server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  data:
    redis:
      host: ${REDISHOST:localhost}
      port: ${REDISPORT:6379}
      password: ${REDISPASSWORD:} # Обязательно добавляем, так как в облаке Redis защищен паролем
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 минут (в Spring Boot этот параметр принимает и миллисекунды, и формат длительности, например 5m)
      cache-null-values: false # Хорошая практика: не забивать кэш пустыми ответами

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payout}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG

jwt:
  secret: ${JWT_SECRET:WCFqULU3JUtPEUluTH6eJ3fZuxDoYh0I}
  expiration: 8640000

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}